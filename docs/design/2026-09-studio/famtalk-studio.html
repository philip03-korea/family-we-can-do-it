if(['learn','home','heart','all'].includes(page)){const title={learn:'배우고 싶은 것',home:'함께 사는 하루',heart:'마음을 나누는 시간',all:'내게 열린 모든 기능'}[page];const list=DATA.features.FEATURES.filter(f=>has(f.key)&&(page==='all'||f.group===page)&&(`${f.name} ${f.desc}`).includes(query));return heading(title)+`<input class="search" id="search" aria-label="기능 검색" placeholder="찾고 싶은 기능" value="${esc(query)}">`+`<div class="section-head"><small>${list.length}개 기능</small></div>`+featureCards(list)}
if(page==='me')return heading('나의 공간','학습 설정과 기록은 여기에 그대로.')+featureCards([{name:'학습 레벨·설정',desc:'기존 레벨 사다리 · 음성 데모 · 알림',key:'settings'},{name:'보상 상점',desc:'내 포인트와 보상',key:'shop'},...(parent()?[{name:'아이별 화면 설정',desc:'배정한 기능만 아이에게 표시',key:'manage'}]:[]),...(who==='dad'?[{name:'교회 교육기획',desc:'기존 아빠 전용 기능 유지',key:'church'}]:[])].filter(f=>!DATA.features.FEATURE_MAP[f.key]||has(f.key)));
if(page==='career'||page==='webtoon'){const web=page==='webtoon';const list=web?DATA.webtoon.SCHOOLS:DATA.career.UNIVERSITIES;return heading(web?'웹툰 입시 가이드':'대학 가이드',web?'학교 · 전형 · 실기 · 일정 · 데뷔':'대학 · 학과 · 지원자격 · 일정 · 확인')+`<div class="banner">${esc(web?DATA.webtoon.DISCLAIMER:DATA.career.DISCLAIMER)}</div><div class="tabs">${(web?[['학교','schools'],['전형','admission'],['실기','practical'],['포트폴리오','portfolio'],['일정','webtimeline'],['데뷔','debut']]:[['대학','universities'],['학과','majors'],['지원자격','eligibility'],['일정','timeline'],['확인','ask']]).map(([l,g])=>btn(l,g)).join('')}</div><div class="cards">${list.map((x,i)=>btn(`<span class="index">${web?'ART & STORY':'UNIVERSITY'} / ${String(i+1).padStart(2,'0')}</span><h3>${esc(x.name)}</h3><p>${esc(x.desc||x.summary||x.college||x.location||'기존 가이드와 준비사항 살펴보기')}</p><span class="link">상세 보기 ↗</span>`,`detail:${web?'webtoon':'career'}:${i}`,'card')).join('')}</div>${btn('입시박사에게 질문하기 ↗','tutor','primary')}`;}
if(page==='cooking'){const list=DATA.recipes.RECIPES.filter(r=>(category==='fav'?favorites.has(r.id):category==='all'||r.cats.includes(category)));return heading('오늘 뭐 만들까?','먹고 싶은 메뉴부터 골라봐요.')+`<div class="tabs">${[...DATA.recipes.CATEGORIES,{key:'fav',name:'저장한 레시피'}].map(c=>btn(c.name,'cat:'+c.key,category===c.key?'selected':'')).join('')}</div><div class="cards">${list.map(r=>btn(`<span class="index">${esc(r.time)} · ${esc(r.servings)}</span><h3>${esc(r.name)}</h3><p>${esc(r.intro)}</p><span class="link">${r.safety==='adult'?'어른과 함께':'준비물 확인'} · 레시피 보기 ↗</span>`,'recipe:'+r.id,'card')).join('')||'<p class="empty">저장한 레시피가 없어요. 레시피를 열고 저장해 보세요.</p>'}</div>`;}
return ''}
function featureCards(list){return `<div class="cards">${list.map((f,i)=>btn(`<span class="index">${String(i+1).padStart(2,'0')}</span><h3>${esc(f.name)}</h3><p>${esc(f.desc)}</p><span class="link">열어보기 ↗</span>`,f.key,'card')).join('')||'<p class="empty">열린 기능이 없어요.</p>'}</div>`}
const labels={name:'이름',desc:'소개',intro:'소개',key:'',id:'',url:'공식 안내',link:'공식 안내',site:'공식 안내',majors:'학과',admission:'입시',note:'참고',notes:'참고',ask:'확인할 것',type:'유형',title:'제목',items:'내용',steps:'순서',tip:'팁',tips:'팁',location:'위치',summary:'요약'};
Object.assign(labels,{college:'대학·학부',en:'영문명',campus:'캠퍼스',tier:'기존 가이드 분류',lang:'수업 언어',scale:'규모',tracks:'전형',english:'어학 안내 · 기존 자료',fit:'기존 가이드 의견',check:'확인할 사항',group:'계열',hot:'기존 관심 표시',track:'전형 안내',when:'시기',docs:'제출 서류',eval:'평가 방식',interview:'면접',minimum:'수능 최저',tuition:'학비',route:'경로',pros:'특징',cons:'고려사항',why:'이유',how:'방법',examples:'예시',time:'시간',format:'형식',materials:'준비물',target:'대상',period:'시기',tasks:'할 일'});
function readable(v){if(v==null)return '';if(typeof v==='string'){if(/^https?:\/\//.test(v))return `<a target="_blank" rel="noopener" href="${esc(v)}">공식 안내 열기 ↗</a>`;return `<p>${esc(v)}</p>`}if(Array.isArray(v))return `<ul>${v.map(x=>`<li>${readable(x)}</li>`).join('')}</ul>`;if(typeof v==='object')return Object.entries(v).filter(([k])=>!['id','key','emoji','from','to','color','bg','tint','image'].includes(k)).map(([k,x])=>`<div class="field"><div class="field-label">${esc(labels[k]??k)}</div>${readable(x)}</div>`).join('');return esc(v)}
function modal(title,html){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#dialog').showModal();bind($('#dialog-body'))}
function go(g){const aliases={schools:'webtoon',universities:'career',recipes:'cooking',easy:'cooking',favorites:'cooking'};if(aliases[g]){category=g==='easy'?'easy':g==='favorites'?'fav':'all';g=aliases[g]}
if(['today','learn','home','heart','all','me','career','webtoon','cooking'].includes(g)){page=g;query='';render();window.scrollTo({top:0,behavior:'instant'});return}
if(g.startsWith('cat:')){category=g.slice(4);render();return}
if(g.startsWith('detail:')){const [,kind,index]=g.split(':');const x=(kind==='webtoon'?DATA.webtoon.SCHOOLS:DATA.career.UNIVERSITIES)[index];modal(x.name,'<div class="banner">'+esc(kind==='career'?DATA.career.DISCLAIMER:DATA.webtoon.DISCLAIMER)+'</div>'+readable(x)+(kind==='career'?readable(DATA.career.ADMISSION[x.key]):''));return}
if(g.startsWith('recipe:')){const r=DATA.recipes.RECIPES.find(r=>r.id===g.slice(7));modal(r.name,`<p>${esc(r.intro)}</p><div class="banner">${esc(r.time)} · ${esc(r.servings)} · ${r.safety==='adult'?'어른과 함께 만들어요':'재료와 도구를 먼저 확인해요'}</div><button class="pill" id="save-recipe">${favorites.has(r.id)?'♥ 저장됨':'♡ 레시피 저장'}</button><h3>준비할 재료</h3>${r.ingredients.map(([a,b])=>`<div class="manage-row"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`).join('')}<h3>하나씩 만들어 봐요</h3>${r.steps.map((s,i)=>`<label class="check"><input type="checkbox"><span>${i+1}. ${esc(s)}</span></label>`).join('')}<div class="banner">${esc(r.tip)}</div>`);$('#save-recipe').onclick=e=>{favorites.has(r.id)?favorites.delete(r.id):favorites.add(r.id);e.target.textContent=favorites.has(r.id)?'♥ 저장됨':'♡ 레시피 저장'};return}
if(g==='manage'){if(!parent())return;modal('아이별 화면 설정',`<p class="muted">시안 안에서만 적용됩니다. 실제 계정 설정은 바뀌지 않습니다.</p><div class="tabs">${['haeum','haul','haram'].map(k=>btn(people[k].name,'edit:'+k)).join('')}</div><div id="switches"></div>`);edit('haeum');return}
if(g.startsWith('edit:')){edit(g.slice(5));return}
const dataPages={practical:['실기 유형',DATA.webtoon.PRACTICAL],portfolio:['포트폴리오',DATA.webtoon.PORTFOLIO],admission:['전형 안내',DATA.webtoon.ADMISSION_TYPES],webtimeline:['일정',DATA.webtoon.TIMELINE],debut:['데뷔 경로',DATA.webtoon.DEBUT],majors:['학과',DATA.career.MAJOR_GROUPS],eligibility:['지원자격',DATA.career.ELIGIBILITY],timeline:['입시 일정',DATA.career.TIMELINE],ask:['학교에 확인할 것',DATA.career.ASK_SCHOOL]};if(dataPages[g]){modal(dataPages[g][0],readable(dataPages[g][1]));return}
if(g==='tutor'){modal('입시박사',`<p>실제 앱에서는 현재 보고 있는 대학·웹툰 가이드를 바탕으로 대화합니다.</p><div class="banner">디자인 시안에서는 AI를 호출하지 않습니다. 기존 대화 기능을 이 위치에 유지하는 안입니다.</div>`);return}
modal(DATA.features.FEATURE_MAP[g]?.name||({settings:'학습 레벨·설정',church:'교회 교육기획'}[g])||'기존 기능',`<p>기존 앱의 내용과 기능을 그대로 유지하는 연결 지점입니다.</p><div class="banner">이번 시안은 홈·진로 가이드·요리·전체 메뉴·노출 설정의 구조를 보여줍니다. 이 기능의 실제 실행과 기록 저장은 하지 않습니다.</div>`)}
function edit(child){$('#switches').innerHTML=`<h3>${people[child].name}에게 보일 기능</h3>`+DATA.features.FEATURES.map(f=>`<label class="manage-row"><span>${esc(f.name)}</span><input type="checkbox" data-feature="${f.key}" ${((overrides[child]??DATA.features.DEFAULT_FEATURES[child]).includes(f.key))?'checked':''}></label>`).join('');$('#switches').querySelectorAll('input').forEach(el=>el.onchange=()=>{overrides[child]=[...$('#switches').querySelectorAll('input:checked')].map(e=>e.dataset.feature)});}
function bind(root=document){root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));const s=$('#search');if(s)s.oninput=()=>{const pos=s.selectionStart;query=s.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}}
$('#member').onchange=e=>{who=e.target.value;page='today';query='';render()};$('#variant').onchange=e=>document.body.className='variant-'+e.target.value;$('#close').onclick=()=>{$('#dialog').close();if(page==='cooking')render()};render();
</script></body></html>
