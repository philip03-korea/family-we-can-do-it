<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0b1220; color: #f8fafc;
      font-family: Pretendard, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
    a { color: #a5b4fc; } a:hover { color: #c7d2fe; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 1400px; height: 470px; background: #0b1220; padding: 32px 36px; display: flex; flex-direction: column; gap: 22px">

  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 5px">
      <span style="font-size: 23px; font-weight: 800">하단 탭은 사람마다 다르게 만들어진다</span>
      <span style="font-size: 14px; color: #a8b4c4">탭 = <strong style="color: #e2e8f0">홈</strong> + 켜진 그룹 + <strong style="color: #e2e8f0">나</strong>. 그룹 안의 기능이 전부 꺼지면 그 탭은 사라진다. 최대 5개, 최소 2개.</span>
    </div>
    <span style="font-size: 12.5px; color: #94a3b8">부모는 설정과 무관하게 항상 전체</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; flex: 1">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
      <div style="border-radius: 22px; border: 1px solid {{c.bd}}; background: rgba(30,41,59,0.45); padding: 18px 18px 0; display: flex; flex-direction: column; gap: 14px">

        <div style="display: flex; align-items: center; gap: 9px">
          <span style="width: 32px; height: 32px; border-radius: 999px; background: {{c.color}}; display: flex; align-items: center; justify-content: center; font-size: 17px">{{c.emoji}}</span>
          <span style="display: flex; flex-direction: column; gap: 0px">
            <span style="font-size: 15px; font-weight: 800">{{c.name}}</span>
            <span style="font-size: 11.5px; color: #a8b4c4">{{c.role}}</span>
          </span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 5px">
          <sc-for list="{{c.notes}}" as="n" hint-placeholder-count="2">
            <span style="font-size: 12px; color: {{n.fg}}; line-height: 1.4">{{n.text}}</span>
          </sc-for>
        </div>

        <div style="margin-top: auto; margin-left: -18px; margin-right: -18px; border-top: 1px solid #1e293b; background: rgba(15,23,42,0.97); border-radius: 0 0 21px 21px; height: 74px; display: grid; grid-template-columns: {{c.cols}}">
          <sc-for list="{{c.nav}}" as="n" hint-placeholder-count="5">
            <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"/></svg>
              <span style="font-size: 10.5px; font-weight: 600; color: {{n.color}}">{{n.label}}</span>
              <span style="height: 2px; width: 20px; border-radius: 999px; background: {{n.bar}}"></span>
            </span>
          </sc-for>
        </div>

      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
const ICON = {
  home:  'M3 10.6 12 3.2l9 7.4M5.6 9.4V20h12.8V9.4',
  learn: 'M4 19V5.2A2 2 0 0 1 6 3.2h12v14H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h12',
  house: 'M9 4.2h6v2.6H9zM7 5.4H5.6A1.6 1.6 0 0 0 4 7v12.6a1.6 1.6 0 0 0 1.6 1.6h12.8a1.6 1.6 0 0 0 1.6-1.6V7a1.6 1.6 0 0 0-1.6-1.6H17M8.6 13l2.4 2.4 4.4-4.4',
  heart: 'M12 20.2s-7-4.5-7-9.3A3.8 3.8 0 0 1 12 8.1a3.8 3.8 0 0 1 7 2.8c0 4.8-7 9.3-7 9.3Z',
  me:    'M12 12.2a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.6 20.4a7.4 7.4 0 0 1 14.8 0'
};

const COLS = [
  { key: 'mom', name: '엄마', emoji: '👩', color: '#ec4899', role: '부모 · 전체 열람',
    tabs: ['홈','배움','집안','마음','나'],
    notes: [['모든 기능 + 관리 도구', true], ['「나」 안에 가족 관리 · 화면 설정', false]] },
  { key: 'dad', name: '아빠', emoji: '👨', color: '#8b5cf6', role: '부모 · 전체 열람',
    tabs: ['홈','배움','집안','마음','나'],
    notes: [['모든 기능 + 관리 도구', true], ['교회 교육기획은 아빠 계정만', false]] },
  { key: 'haeum', name: '하음', emoji: '👧', color: '#eab308', role: '고3 · 레벨 D',
    tabs: ['홈','배움','집안','마음','나'],
    notes: [['수학 · TOEFL 꺼둠 (고3 부담)', true], ['마음 상담 열림', false]] },
  { key: 'haul', name: '하울', emoji: '🧑', color: '#84cc16', role: '고1 · 레벨 E',
    tabs: ['홈','배움','집안','마음','나'],
    notes: [['TOEFL · 수학 영어 열림', true], ['계획표만 꺼둠', false]] },
  { key: 'haram', name: '하람', emoji: '👦', color: '#3b82f6', role: '중1 · 레벨 B',
    tabs: ['홈','배움','집안','나'],
    notes: [['마음 그룹 전체 꺼둠 → 탭 사라짐', true], ['주간 계획표는 하람만 열림', false]] }
];

const D = { '홈': ICON.home, '배움': ICON.learn, '집안': ICON.house, '마음': ICON.heart, '나': ICON.me };

class Component extends DCLogic {
  renderVals() {
    return {
      cols: COLS.map(function (c) {
        return {
          name: c.name, emoji: c.emoji, color: c.color, role: c.role,
          bd: c.tabs.length < 5 ? '#4f46e5' : '#334155',
          cols: 'repeat(' + c.tabs.length + ', minmax(0, 1fr))',
          notes: c.notes.map(function (n) {
            return { text: n[0], fg: n[1] ? '#e2e8f0' : '#94a3b8' };
          }),
          nav: c.tabs.map(function (t, i) {
            return { label: t, d: D[t],
                     color: i === 0 ? '#ffffff' : '#a8b4c4',
                     bar: i === 0 ? '#818cf8' : 'transparent' };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
