<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0b1220; color: #f8fafc;
      font-family: Pretendard, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
    a { color: #a5b4fc; } a:hover { color: #c7d2fe; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 1400px; height: 830px; background: #0b1220; padding: 32px 36px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; flex-direction: column; gap: 5px">
    <span style="font-size: 23px; font-weight: 800">정보구조 — 쌓아 올린 17개를 4개 그룹으로</span>
    <span style="font-size: 14px; color: #a8b4c4">기능을 빼지 않는다. 어디에 사는지를 정하고, 누구에게 열지를 부모가 고른다.</span>
  </div>

  <div style="display: grid; grid-template-columns: 470px minmax(0, 1fr); gap: 26px; flex: 1">

    <div style="border-radius: 22px; border: 1px solid #334155; background: rgba(30,41,59,0.4); padding: 22px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 9px">
        <span style="font-size: 11.5px; font-weight: 800; color: #0b1220; background: #94a3b8; border-radius: 999px; padding: 3px 10px">지금</span>
        <span style="font-size: 15px; font-weight: 800">홈 한 화면에 전부</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{current}}" as="c" hint-placeholder-count="9">
          <div style="display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 11px; background: {{c.bg}}; border: 1px solid {{c.bd}}">
            <span style="width: 5px; height: 5px; border-radius: 999px; background: {{c.dot}}; flex: none"></span>
            <span style="flex: 1; font-size: 12.5px; font-weight: 600; color: {{c.fg}}">{{c.label}}</span>
            <span style="font-size: 11.5px; color: #64748b">{{c.meta}}</span>
          </div>
        </sc-for>
      </div>

      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12.5px; font-weight: 800; color: #cbd5e1">이래서 안 된다</span>
        <sc-for list="{{problems}}" as="p" hint-placeholder-count="4">
          <div style="display: flex; align-items: flex-start; gap: 8px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M6 6l12 12M18 6 6 18"/></svg>
            <span style="font-size: 12.5px; color: #cbd5e1; line-height: 1.45">{{p.text}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="border-radius: 22px; border: 1px solid #4f46e5; background: rgba(79,70,229,0.07); padding: 22px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 9px">
        <span style="font-size: 11.5px; font-weight: 800; color: #ffffff; background: #4f46e5; border-radius: 999px; padding: 3px 10px">제안</span>
        <span style="font-size: 15px; font-weight: 800">홈은 오늘만, 나머지는 그룹 안으로</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; flex: 1">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
          <div style="border-radius: 18px; border: 1px solid #334155; background: rgba(15,23,42,0.6); padding: 15px 14px; display: flex; flex-direction: column; gap: 11px">
            <div style="display: flex; flex-direction: column; gap: 7px">
              <span style="width: 34px; height: 34px; border-radius: 12px; background: {{g.wash}}; display: flex; align-items: center; justify-content: center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{g.tint}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.d}}"/></svg>
              </span>
              <span style="display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 14.5px; font-weight: 800">{{g.label}}</span>
                <span style="font-size: 11px; color: #94a3b8">{{g.note}}</span>
              </span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 5px">
              <sc-for list="{{g.items}}" as="i" hint-placeholder-count="5">
                <span style="font-size: 12px; font-weight: 600; color: {{i.fg}}; padding: 6px 10px; border-radius: 9px; background: {{i.bg}}">{{i.name}}</span>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px">
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
          <div style="border-radius: 14px; background: rgba(15,23,42,0.6); border: 1px solid #334155; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 12px; font-weight: 800; color: #a5b4fc">{{r.title}}</span>
            <span style="font-size: 12px; color: #cbd5e1; line-height: 1.45">{{r.text}}</span>
          </div>
        </sc-for>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
const ICON = {
  learn: 'M4 19V5.2A2 2 0 0 1 6 3.2h12v14H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h12',
  house: 'M9 4.2h6v2.6H9zM7 5.4H5.6A1.6 1.6 0 0 0 4 7v12.6a1.6 1.6 0 0 0 1.6 1.6h12.8a1.6 1.6 0 0 0 1.6-1.6V7a1.6 1.6 0 0 0-1.6-1.6H17M8.6 13l2.4 2.4 4.4-4.4',
  heart: 'M12 20.2s-7-4.5-7-9.3A3.8 3.8 0 0 1 12 8.1a3.8 3.8 0 0 1 7 2.8c0 4.8-7 9.3-7 9.3Z',
  gear:  'M4.4 7.4h9M17.4 7.4h2.2M4.4 16.6h4.2M12.6 16.6h7M15.4 4.6v5.6M10.4 13.8v5.6'
};

class Component extends DCLogic {
  renderVals() {
    const current = [
      ['미리보기 바 + 헤더', '부모만', false],
      ['내 레벨 카드', '', false],
      ['XP · 배지', '', false],
      ['바로가기 타일', '12개 · 3열', true],
      ['TOEFL 버튼', '하울만', false],
      ['오늘의 학습 + 퀴즈 3종', '', false],
      ['내 관심사 영어', '아이별', false],
      ['음성 데모 (TTS/STT)', '개발용', true],
      ['레벨 사다리 A~F', '6줄', true],
      ['알림 · 효과음 설정', '', true]
    ];
    const problems = [
      '홈이 런처가 되어 화면이 계속 길어진다 — 새 기능마다 타일 한 칸씩',
      '하단 탭 5개가 고정인데 정작 「학습」이 없다 (홈·집안일·식단표·가족·상점)',
      '아이 화면에도 남의 기능이 다 보인다 — 예외는 아빠 전용 교회 탭 하나뿐',
      '음성 데모·레벨 사다리처럼 개발 중 만든 것이 그대로 남아 있다'
    ];
    const groups = [
      { label: '배움', d: ICON.learn, tint: '#818cf8', wash: 'rgba(129,140,248,0.15)', note: '아이별로 다름',
        items: ['단어 학습','단어장','복습 퀴즈','문장 읽기','AI 회화','수학 연습','TOEFL'] },
      { label: '집안', d: ICON.house, tint: '#2dd4bf', wash: 'rgba(45,212,191,0.15)', note: '대체로 전원 공통',
        items: ['집안일','식단표','계획표','보상 상점'] },
      { label: '마음', d: ICON.heart, tint: '#f472b6', wash: 'rgba(244,114,182,0.15)', note: '나이 따라 열고 닫기',
        items: ['마음 상담','가족 대화','가족 현황'] },
      { label: '나', d: ICON.gear, tint: '#fbbf24', wash: 'rgba(251,191,36,0.15)', note: '항상 있음',
        items: ['내 프로필 · 배지','알림 · 효과음','사용설명서','화면 설정 (부모)','상점 관리 (부모)','교회 교육기획 (아빠)'] }
    ];
    const rules = [
      { title: '홈은 런처가 아니다', text: '오늘 해야 할 3~4줄만. 기능 목록은 그룹 탭이 맡는다.' },
      { title: '부모는 설정 밖에 있다', text: '엄마·아빠는 노출 설정과 무관하게 항상 전체를 본다.' },
      { title: '빈 그룹은 사라진다', text: '그룹 안이 전부 꺼지면 하단 탭에서도 빠진다.' }
    ];

    return {
      current: current.map(function (c) {
        return { label: c[0], meta: c[1],
                 fg: c[2] ? '#fda4af' : '#cbd5e1',
                 bg: c[2] ? 'rgba(251,113,133,0.08)' : 'rgba(15,23,42,0.5)',
                 bd: c[2] ? 'rgba(251,113,133,0.3)' : '#1e293b',
                 dot: c[2] ? '#fb7185' : '#475569' };
      }),
      problems: problems.map(function (t) { return { text: t }; }),
      groups: groups.map(function (g) {
        return Object.assign({}, g, {
          items: g.items.map(function (n) {
            const parentOnly = n.indexOf('(') >= 0;
            return { name: n,
                     fg: parentOnly ? '#94a3b8' : '#e2e8f0',
                     bg: parentOnly ? 'rgba(30,41,59,0.4)' : 'rgba(30,41,59,0.8)' };
          })
        });
      }),
      rules: rules
    };
  }
}
</script>
</body>
</html>
