<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0f172a; color: #f8fafc;
      font-family: Pretendard, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
    a { color: #a5b4fc; } a:hover { color: #c7d2fe; }
    * { box-sizing: border-box; }
    .scr { width: 390px; height: 980px; overflow: hidden; position: relative; background: #0f172a; }
    .body { position: absolute; inset: 0 0 84px 0; overflow: hidden; padding: 16px 20px 8px; }
  </style>
</helmet>

<div class="scr">
  <div class="body">

    <header style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px">
      <span style="width: 32px; height: 32px; border-radius: 11px; background: #1e293b; border: 1px solid #334155; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 19px; font-weight: 800; line-height: 1.15">화면 설정</span>
        <span style="font-size: 11.5px; color: #a8b4c4">아이에게 어떤 탭을 보여줄지 정합니다</span>
      </div>
    </header>

    <div style="display: flex; gap: 7px; margin-bottom: 14px">
      <sc-for list="{{kids}}" as="k" hint-placeholder-count="3">
        <button onClick="{{ k.pick }}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 0; border-radius: 15px; border: 1px solid {{k.bd}}; background: {{k.bg}}; cursor: pointer; font-family: inherit">
          <span style="width: 24px; height: 24px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 14px; background: {{k.color}}">{{k.emoji}}</span>
          <span style="font-size: 13.5px; font-weight: 700; color: {{k.ink}}">{{k.name}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(30,41,59,0.6); border: 1px solid #334155; margin-bottom: 16px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6h.01"/></svg>
      <span style="font-size: 11.5px; color: #cbd5e1; line-height: 1.45">끈 기능은 {{who}} 화면에서 완전히 사라집니다. 그룹 안이 전부 꺼지면 하단 탭도 함께 사라집니다.</span>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="margin-bottom: 16px">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
          <span style="display: flex; align-items: center; gap: 7px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.tint}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.d}}"/></svg>
            <span style="font-size: 13.5px; font-weight: 800">{{g.label}}</span>
          </span>
          <span style="font-size: 11.5px; font-weight: 600; color: {{g.countColor}}">{{g.countLabel}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
            <button onClick="{{ it.toggle }}" style="display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 14px; border: 1px solid {{it.bd}}; background: {{it.bg}}; cursor: pointer; font-family: inherit">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{it.icon}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="{{it.d}}"/></svg>
              <span style="flex: 1; font-size: 13.5px; font-weight: 600; color: {{it.fg}}">{{it.name}}</span>
              <span style="width: 40px; height: 23px; flex: none; border-radius: 999px; background: {{it.track}}; display: flex; align-items: center; padding: 0 3px; justify-content: {{it.justify}}">
                <span style="width: 17px; height: 17px; border-radius: 999px; background: #f8fafc"></span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; border-top: 1px solid #1e293b; background: rgba(15,23,42,0.97); padding: 12px 20px; display: flex; flex-direction: column; gap: 7px">
    <span style="font-size: 11px; color: #a8b4c4">{{who}}에게 보이는 하단 탭</span>
    <div style="display: flex; align-items: center; gap: 6px">
      <sc-for list="{{preview}}" as="p" hint-placeholder-count="4">
        <span style="display: flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: #1e293b; border: 1px solid #334155">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.d}}"/></svg>
          <span style="font-size: 12px; font-weight: 700; color: #e2e8f0">{{p.label}}</span>
        </span>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
const ICON = {
  home:  'M3 10.6 12 3.2l9 7.4M5.6 9.4V20h12.8V9.4',
  learn: 'M4 19V5.2A2 2 0 0 1 6 3.2h12v14H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h12',
  house: 'M9 4.2h6v2.6H9zM7 5.4H5.6A1.6 1.6 0 0 0 4 7v12.6a1.6 1.6 0 0 0 1.6 1.6h12.8a1.6 1.6 0 0 0 1.6-1.6V7a1.6 1.6 0 0 0-1.6-1.6H17M8.6 13l2.4 2.4 4.4-4.4',
  heart: 'M12 20.2s-7-4.5-7-9.3A3.8 3.8 0 0 1 12 8.1a3.8 3.8 0 0 1 7 2.8c0 4.8-7 9.3-7 9.3Z',
  me:    'M12 12.2a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.6 20.4a7.4 7.4 0 0 1 14.8 0',
  study: 'M12 6.6A4.4 4.4 0 0 0 7.6 3H3.2v14.4h4.4A4 4 0 0 1 12 21m0-14.4A4.4 4.4 0 0 1 16.4 3h4.4v14.4h-4.4A4 4 0 0 0 12 21m0-14.4V21',
  words: 'M6.4 3.2h11a1.8 1.8 0 0 1 1.8 1.8v15.8H6.4a1.8 1.8 0 0 1-1.8-1.8V5a1.8 1.8 0 0 1 1.8-1.8Zm0 13.6h12.8M9.2 7.4h7',
  quiz:  'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.9-.9 1.5v.6M12 17.2h.01',
  sent:  'M4.2 6.6h15.6M4.2 12h15.6M4.2 17.4h9',
  chat:  'M20 15.2a2 2 0 0 1-2 2H8.4l-4.4 4V5.4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9.8Z',
  math:  'M4.4 7.2h6M7.4 4.2v6M13.6 16.2h6M13.6 20h6M4.4 16.6l4.4 4.4M8.8 16.6l-4.4 4.4',
  toefl: 'M12 3.6 2.6 8.4 12 13.2l9.4-4.8L12 3.6Zm7 7.4v4.6c0 1.7-3.1 3-7 3s-7-1.3-7-3V11',
  meals: 'M6.4 3.2v7.4a2 2 0 0 0 4 0V3.2M8.4 10.6V21M17.4 3.2c-1.7 1-2.6 3-2.6 5.6s.9 4.4 2.6 4.4V21',
  sched: 'M4.2 6.6a1.8 1.8 0 0 1 1.8-1.8h12a1.8 1.8 0 0 1 1.8 1.8v12.6a1.8 1.8 0 0 1-1.8 1.8H6a1.8 1.8 0 0 1-1.8-1.8V6.6Zm0 4h15.6M8.4 2.8v4M15.6 2.8v4',
  shop:  'M5 8h14l-1.2 12H6.2L5 8Z M8.5 8V6a3.5 3.5 0 0 1 7 0v2',
  talk:  'M8.4 13.2a2 2 0 0 1-2 2h-1l-3 3V6.4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2M10.4 9.4h9a2 2 0 0 1 2 2v9l-3-3h-8a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2Z',
  fam:   'M9 11.4a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2.4 20.4a6.8 6.8 0 0 1 13.2 0M17 11.4a3 3 0 1 0 0-6M21.6 20.4a6.8 6.8 0 0 0-4.8-6.5'
};

const KIDS = [
  { key: 'haeum', name: '하음', emoji: '👧', color: '#eab308', ink: '#422006' },
  { key: 'haul',  name: '하울', emoji: '🧑', color: '#84cc16', ink: '#1a2e05' },
  { key: 'haram', name: '하람', emoji: '👦', color: '#3b82f6', ink: '#0a2540' }
];

const GROUPS = [
  { key: 'learn', label: '배움', d: ICON.learn, tint: '#818cf8', navLabel: '배움',
    items: [['study','단어 학습',ICON.study],['words','단어장',ICON.words],['quiz','복습 퀴즈',ICON.quiz],['sentences','문장 읽기',ICON.sent],['chat','AI 회화',ICON.chat],['math','수학 연습',ICON.math],['toefl','TOEFL',ICON.toefl]] },
  { key: 'home', label: '집안', d: ICON.house, tint: '#2dd4bf', navLabel: '집안',
    items: [['chores','집안일',ICON.house],['meals','식단표',ICON.meals],['schedule','계획표',ICON.sched],['shop','보상 상점',ICON.shop]] },
  { key: 'heart', label: '마음', d: ICON.heart, tint: '#f472b6', navLabel: '마음',
    items: [['counsel','마음 상담',ICON.heart],['talk','가족 대화',ICON.talk],['family','가족 현황',ICON.fam]] }
];

const DEFAULTS = {
  haeum: ['study','words','quiz','sentences','chat','chores','meals','shop','counsel','talk','family'],
  haul:  ['study','words','quiz','sentences','chat','math','toefl','chores','meals','shop','counsel','talk','family'],
  haram: ['study','words','quiz','sentences','math','chores','meals','shop','schedule']
};

class Component extends DCLogic {
  renderVals() {
    const self = this;
    const st = this.state || {};
    const child = st.child || 'haram';
    const map = st.map || DEFAULTS;
    const on = map[child] || [];
    const me = KIDS.filter(function (k) { return k.key === child; })[0];

    function toggle(featureKey) {
      const cur = (self.state && self.state.map ? self.state.map : DEFAULTS)[child] || [];
      const next = cur.indexOf(featureKey) >= 0
        ? cur.filter(function (x) { return x !== featureKey; })
        : cur.concat([featureKey]);
      const nextMap = Object.assign({}, (self.state && self.state.map) || DEFAULTS);
      nextMap[child] = next;
      self.setState({ child: child, map: nextMap });
    }

    const groups = GROUPS.map(function (g) {
      let live = 0;
      const items = g.items.map(function (it) {
        const isOn = on.indexOf(it[0]) >= 0;
        if (isOn) live += 1;
        return {
          name: it[1], d: it[2],
          bg: isOn ? 'rgba(30,41,59,0.6)' : 'rgba(15,23,42,0.6)',
          bd: isOn ? '#334155' : '#1e293b',
          fg: isOn ? '#f8fafc' : '#94a3b8',
          icon: isOn ? g.tint : '#64748b',
          track: isOn ? '#4f46e5' : '#334155',
          justify: isOn ? 'flex-end' : 'flex-start',
          toggle: function () { toggle(it[0]); }
        };
      });
      return {
        label: g.label, d: g.d, tint: g.tint, items: items, live: live, navLabel: g.navLabel,
        countLabel: live === 0 ? '탭 숨김' : live + ' / ' + g.items.length,
        countColor: live === 0 ? '#94a3b8' : '#cbd5e1'
      };
    });

    const preview = [{ label: '홈', d: ICON.home }]
      .concat(groups.filter(function (g) { return g.live > 0; })
                    .map(function (g) { return { label: g.navLabel, d: g.d }; }))
      .concat([{ label: '나', d: ICON.me }]);

    return {
      who: me ? me.name : '',
      kids: KIDS.map(function (k) {
        return Object.assign({}, k, {
          bg: k.key === child ? k.color : '#1e293b',
          bd: k.key === child ? '#f8fafc' : '#334155',
          ink: k.key === child ? k.ink : '#cbd5e1',
          pick: function () { self.setState({ child: k.key, map: map }); }
        });
      }),
      groups: groups,
      preview: preview
    };
  }
}
</script>
</body>
</html>
