<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>

    body { margin: 0; background: #0f172a; color: #f8fafc;
           font-family: Pretendard, system-ui, -apple-system, sans-serif;
           -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }

    a { color: #a5b4fc; } a:hover { color: #c7d2fe; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0f172a; position: relative; overflow: hidden">

        <div style="font-size: 12px; margin-top: 2px; font-weight: 700; color: #cbd5e1">엄마</div>
      </div>
      <div style="flex: 1; border-radius: 12px; padding: 6px 0; text-align: center; border: 1px solid #334155; background: #1e293b">

        <div style="font-size: 12px; margin-top: 2px; font-weight: 700; color: #cbd5e1">하음</div>
      </div>
      <div style="flex: 1; border-radius: 12px; padding: 6px 0; text-align: center; border: 1px solid #ffffff; background: #84cc16">

      </div>
    </div>

    <!-- 헤더 -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px">
      <div>
        <p style="color: #cbd5e1; font-size: 12.5px; margin: 0">미리보기 👀</p>

      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 12.5px; font-weight: 700; background: #1e293b; padding: 6px 12px; border-radius: 9999px">🛒 640P</span>
        <span style="font-size: 12.5px; font-weight: 700; background: #1e293b; padding: 6px 12px; border-radius: 9999px">🔥 21일</span>
      </div>
    </div>

    <!-- 레벨 카드 -->
    <div style="background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%); border-radius: 24px; padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 15px rgba(0,0,0,0.3)">
      <p style="color: rgba(255,255,255,0.8); font-size: 12.5px; margin: 0">내 레벨</p>
      <div style="display: flex; align-items: flex-end; gap: 12px">
        <span style="font-size: 48px; font-weight: 900; color: #fff; line-height: 1">E</span>
        <span style="color: rgba(255,255,255,0.9); margin-bottom: 6px; font-weight: 500">B2 · 심화</span>

    <!-- 그룹 카드 3개 (기존 타일 12개를 대체) -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 24px">
      <div style="background: rgba(30,41,59,0.6); border: 1px solid #334155; border-radius: 16px; padding: 14px 12px">
        <div style="font-size: 24px; line-height: 1; margin-bottom: 6px">🎓</div>
        <div style="font-weight: 700; font-size: 12.5px">배움</div>
        <div style="font-size: 12px; color: #cbd5e1">10개</div>
      </div>
      <div style="background: rgba(30,41,59,0.6); border: 1px solid #334155; border-radius: 16px; padding: 14px 12px">
        <div style="font-size: 24px; line-height: 1; margin-bottom: 6px">🏠</div>
        <div style="font-weight: 700; font-size: 12.5px">집안</div>
        <div style="font-size: 12px; color: #cbd5e1">4개</div>
      </div>
      <div style="background: rgba(30,41,59,0.6); border: 1px solid #334155; border-radius: 16px; padding: 14px 12px">
        <div style="font-size: 24px; line-height: 1; margin-bottom: 6px">💗</div>
        <div style="font-weight: 700; font-size: 12.5px">마음</div>
        <div style="font-size: 12px; color: #cbd5e1">3개</div>
      </div>
    </div>

    <!-- 오늘의 학습 -->
    <div style="background: rgba(30,41,59,0.6); border: 1px solid #334155; border-radius: 24px; padding: 20px">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px">
        <h2 style="font-size: 18px; font-weight: 700; margin: 0">오늘의 학습</h2>
        <span style="font-size: 12.5px; color: #cbd5e1">학습한 단어 412/1,860</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px">
        <div style="background: #0f172a; border-radius: 16px; padding: 16px; text-align: center">
          <div style="font-size: 30px; font-weight: 900; color: #fbbf24; line-height: 1">12</div>
          <div style="color: #cbd5e1; font-size: 12.5px; margin-top: 4px">복습 대기</div>
        </div>
        <div style="background: #0f172a; border-radius: 16px; padding: 16px; text-align: center">
          <div style="font-size: 30px; font-weight: 900; color: #34d399; line-height: 1">6</div>
          <div style="color: #cbd5e1; font-size: 12.5px; margin-top: 4px">새 단어</div>
        </div>
      </div>
      <div style="background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%); border-radius: 16px; padding: 16px; text-align: center; font-weight: 700; font-size: 18px">학습 시작 →</div>
    </div>
  </div>

  <!-- 하단 탭 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #1e293b; background: rgba(15,23,42,0.95)">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0; color: #fff">
        <span style="font-size: 20px; line-height: 1">🏠</span><span style="font-size: 12px; font-weight: 500">홈</span>
        <span style="height: 2px; width: 24px; border-radius: 9999px; margin-top: 2px; background: #818cf8"></span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0; color: #cbd5e1">
        <span style="font-size: 20px; line-height: 1; opacity: 0.8">🎓</span><span style="font-size: 12px; font-weight: 500">배움</span>
        <span style="height: 2px; width: 24px; margin-top: 2px"></span>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0; color: #cbd5e1">
